[workspace]
resolver = "2"
# app/src-tauri 独立成包（Tauri 惯例，自带 lockfile），不进 workspace
members = ["crates/maxcom-core", "crates/maxcom-engine"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["FXX-MAXCOM contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
toml = "0.8"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
