[package]
name = "maxcom-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MAXCOM 传输层（串口/TCP/UDP/SSH/Telnet）+ 会话线程编排"

[dependencies]
maxcom-core = { path = "../maxcom-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = "0.5"
telnet = "0.2"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
bytes = "1"
probe-rs = { version = "0.32", default-features = false, features = ["builtin-targets", "builtin-formats", "cmsisdap_v1"], optional = true }
nusb = { workspace = true, optional = true }
hidapi = { workspace = true, optional = true }

[features]
default = ["serial"]
serial = ["dep:serialport", "dep:xmodem", "dep:ymodem", "dep:zmodem2"]
rtt = ["dep:probe-rs"]
# USB 原始传输（winusb）+ HID 传输（桌面端启用；移动端不编译，避免 Android 链接问题）
usb = ["dep:nusb", "dep:hidapi"]

[dependencies.serialport]
version = "4"
optional = true

# 串口文件传输协议（烧录页 BL 交互：X/Y/ZMODEM）
[dependencies.xmodem]
version = "0.4"
optional = true

[dependencies.ymodem]
version = "0.1"
optional = true

[dependencies.zmodem2]
version = "0.7"
optional = true
