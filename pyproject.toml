[project]
name = "maxcom"
version = "0.1.0"
description = "一站式串口/网络调试与数据可视化平台"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dearpygui==2.3.1",
    "pyserial==3.5",
    "pydantic==2.13.4",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "tomli-w==1.2.0",
    "pywinusb==0.4.2",
    "hidapi==0.15.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-benchmark==5.2.3",
    "nuitka==4.1.3",
]

# 应用非库：uv 不构建/安装项目自身，src/ 由 pytest pythonpath 与运行时 PYTHONPATH 提供。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
