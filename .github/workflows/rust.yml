name: Rust/前端 CI（rust-tauri 分支）

on:
  push:
    branches: [main, rust-tauri]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"
      - name: 安装 libudev（Linux 串口链接）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace --no-default-features
      # 含串口 feature 的完整编译（Windows 目标平台主路径；ubuntu 装 libudev 后同样可验）
      - run: cargo test --workspace

  tauri-shell:
    # 外壳薄胶水层编译验证（业务逻辑已在 core/engine 覆盖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 tag 与 Tauri 版本一致
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag v$tag_version 与 app/src-tauri/tauri.conf.json 版本 $app_version 不一致"
            exit 1
          fi
          echo "版本校验通过：v$tag_version"

  # 桌面构建：Windows / Linux / macOS 三个目标平台并行
  desktop-build:
    needs: [core-engine, tauri-shell, frontend]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: "nsis"
            artifact: MAXCOM-windows-x64
            extra-apt: ""
          - os: ubuntu-latest
            bundle: "deb,appimage"
            artifact: MAXCOM-linux-x64
            extra-apt: >
              sudo apt-get update &&
              sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
              libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev zip
          - os: macos-latest
            bundle: "dmg"
            artifact: MAXCOM-macos
            extra-apt: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: ${{ matrix.extra-apt }}
      - name: 构建前端依赖
        run: npm ci
        working-directory: app
      - name: Tauri 构建（release）
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: app
      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          $version = (Get-Content app\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $portable = "dist-artifacts\MAXCOM_${version}_windows-x64.exe"
          Copy-Item app\src-tauri\target\release\maxcom.exe $portable
          Compress-Archive -LiteralPath $portable -DestinationPath "dist-artifacts\MAXCOM_${version}_windows-x64-portable.zip" -Force
          Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination dist-artifacts\
      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-artifacts
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          portable="dist-artifacts/MAXCOM_${version}_linux-x64"
          cp app/src-tauri/target/release/maxcom "$portable"
          chmod +x "$portable"
          (cd dist-artifacts && zip -q "MAXCOM_${version}_linux-x64-portable.zip" "MAXCOM_${version}_linux-x64")
          find app/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-artifacts/ \;
      - name: 收集产物（macOS）
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-artifacts
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          arch="$(uname -m)"
          app_dir="app/src-tauri/target/release/bundle/macos/MAXCOM.app"
          test -d "$app_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_dir" "dist-artifacts/MAXCOM_${version}_macos-${arch}-portable.zip"
          find app/src-tauri/target/release/bundle -type f \( -name "*.dmg" \) -exec cp {} dist-artifacts/ \;
      - name: 打印产物清单
        shell: bash
        run: ls -la dist-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/*
          if-no-files-found: error

  # Android：安装 SDK/NDK + Rust android targets，编译 APK（serial/rtt 经 mobile feature 禁用）
  android-build:
    needs: [core-engine, tauri-shell, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Rust android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v4
        with:
          # 平台(android-XXX)/build-tools 由 Android Gradle Plugin 在构建时自动按需下载；
          # 已同意 SDK 许可证（默认 true），故无需在此指定 api-level/target。
          accept-android-sdk-licenses: true
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle
      - run: npm ci
        working-directory: app
      - name: 初始化 Android 工程（生成 src-tauri/gen/android，提交入库）
        run: npx tauri android init --ci
        working-directory: app
      - name: 应用安卓原生补丁（状态栏/键盘/APK签名）
        run: bash scripts/android-native-patch.sh
        working-directory: app
      - name: Tauri Android 构建（release APK）
        run: npx tauri android build --apk
        working-directory: app
      - name: 收集 APK
        run: |
          mkdir -p dist-artifacts
          find app/src-tauri/gen/android -name "*.apk" -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: MAXCOM-android
          path: dist-artifacts/*
          if-no-files-found: error

  # 打 tag 时：汇总三平台产物发 Release
  release:
    needs: [version-check, desktop-build, android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: 打印产物
        run: ls -la release-artifacts
      - name: 校验发布产物完整
        shell: bash
        run: |
          set -euo pipefail
          for ext in exe zip deb AppImage dmg apk; do
            match="$(find release-artifacts -maxdepth 1 -type f -name "*.$ext" -print -quit)"
            if [ -z "$match" ]; then
              echo "::error::发布产物缺少 *.$ext 文件"
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
