name: Rust/前端 CI（rust-tauri 分支）

on:
  push:
    branches: [main, rust-tauri]
  pull_request:

jobs:
  core-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"
      - name: 安装 libudev（Linux 串口链接）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace --no-default-features
      # 含串口 feature 的完整编译（Windows 目标平台主路径；ubuntu 装 libudev 后同样可验）
      - run: cargo test --workspace

  tauri-shell:
    # 外壳薄胶水层编译验证（业务逻辑已在 core/engine 覆盖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  desktop-build:
    # Windows 可执行产物（目标平台）。push 到主分支构建 artifact；打 tag 额外发 Release
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 构建前端依赖
        run: npm ci
        working-directory: app
      - name: Tauri 构建（release）
        run: npm run tauri build
        working-directory: app
      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          Copy-Item app\src-tauri\target\release\maxcom.exe dist-artifacts\
          Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination dist-artifacts\
          Get-ChildItem dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: MAXCOM-windows-x64
          path: dist-artifacts/*
      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
