name: Rust/前端 CI（rust-tauri 分支）

on:
  push:
    branches: [main, rust-tauri]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"
      - name: 安装 libudev（Linux 串口链接）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace --no-default-features
      # 含串口 feature 的完整编译（Windows 目标平台主路径；ubuntu 装 libudev 后同样可验）
      - run: cargo test --workspace

  tauri-shell:
    # 外壳薄胶水层编译验证（业务逻辑已在 core/engine 覆盖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  # 桌面构建：Windows / Linux / macOS 三个目标平台并行
  desktop-build:
    needs: [core-engine, tauri-shell, frontend]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: "nsis"
            artifact: MAXCOM-windows-x64
            extra-apt: ""
          - os: ubuntu-latest
            bundle: "deb,appimage"
            artifact: MAXCOM-linux-x64
            extra-apt: >
              sudo apt-get update &&
              sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
              libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
          - os: macos-latest
            bundle: "dmg"
            artifact: MAXCOM-macos
            extra-apt: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: ${{ matrix.extra-apt }}
      - name: 构建前端依赖
        run: npm ci
        working-directory: app
      - name: Tauri 构建（release）
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: app
      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          Copy-Item app\src-tauri\target\release\maxcom.exe dist-artifacts\
          Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination dist-artifacts\
      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-artifacts
          find app/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-artifacts/ \;
      - name: 收集产物（macOS）
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-artifacts
          find app/src-tauri/target/release/bundle -type f \( -name "*.dmg" \) -exec cp {} dist-artifacts/ \;
      - name: 打印产物清单
        shell: bash
        run: ls -la dist-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/*

  # Android：安装 SDK/NDK + Rust android targets，编译 APK（serial/rtt 经 mobile feature 禁用）
  android-build:
    needs: [core-engine, tauri-shell, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Rust android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v4
        with:
          # 平台(android-XXX)/build-tools 由 Android Gradle Plugin 在构建时自动按需下载；
          # 已同意 SDK 许可证（默认 true），故无需在此指定 api-level/target。
          accept-android-sdk-licenses: true
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle
      - run: npm ci
        working-directory: app
      - name: 初始化 Android 工程（生成 src-tauri/gen/android，提交入库）
        run: npx tauri android init --ci
        working-directory: app
      - name: 应用安卓原生补丁（状态栏/键盘/APK签名）
        run: bash scripts/android-native-patch.sh
        working-directory: app
      - name: Tauri Android 构建（release APK）
        run: npx tauri android build --apk
        working-directory: app
      - name: 收集 APK
        run: |
          mkdir -p dist-artifacts
          find app/src-tauri/gen/android -name "*.apk" -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: MAXCOM-android
          path: dist-artifacts/*

  # 打 tag 时：汇总三平台产物发 Release
  release:
    needs: [desktop-build, android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: 打印产物
        run: ls -la release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
