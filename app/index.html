<!doctype html>
<html lang="zh_CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAXCOM</title>
  </head>
  <body>
    <header id="topbar">
      <span class="brand">MAXCOM</span>
      <div id="conn-type-dd"></div>
      <div id="serial-port-dd" class="grow"></div>
      <button id="refresh-ports" title="刷新串口列表">⟳</button>
      <div id="baud-dd"></div>
      <button id="more-serial" class="serial-only" title="数据位/停止位/校验/流控">更多串口设置 ⚙</button>
      <button id="selftest-btn" class="serial-only" title="发送标记字节并等待回环，定位链路断层">回环自检</button>
      <label class="chk serial-only"><input id="dtr-chk" type="checkbox" />DTR</label>
      <label class="chk serial-only"><input id="rts-chk" type="checkbox" />RTS</label>
      <div id="tcp-host-dd" class="hidden"></div>
      <input id="tcp-port" type="number" placeholder="端口" value="8888" class="hidden" />
      <label class="chk"><input id="auto-reconnect" type="checkbox" checked />自动重连</label>
      <button id="connect-btn" class="primary">连接</button>
      <span id="conn-state" class="dot off" title="未连接"></span>
      <span id="conn-label"></span>
      <div id="serial-setup" class="setup-pop hidden">
        <div class="setup-title">串口设置</div>
        <label>数据位 <div id="databits-dd"></div></label>
        <label>停止位 <div id="stopbits-dd"></div></label>
        <label>校验 <div id="parity-dd"></div></label>
        <label>流控 <div id="flowctl-dd"></div></label>
        <button id="setup-ok" class="primary">确定</button>
      </div>
    </header>
    <div id="layout">
      <nav id="sidebar">
        <button data-page="terminal" title="交互式终端">⌨️<span>终端</span></button>
        <button data-page="logview" class="active" title="传统收发">📄<span>收发</span></button>
        <button data-page="plot" title="数据绘图">📈<span>绘图</span></button>
        <button data-page="stats" title="统计仪表盘">📊<span>统计</span></button>
      </nav>
      <main id="pages">
        <section id="page-terminal" class="page hidden"></section>
        <section id="page-logview" class="page">
          <div class="logview-grid">
            <div class="logview-main">
              <div id="log-controls">
                <label>时间戳 <div id="ts-mode-dd" class="inline-dd"></div></label>
                <label>编码 <div id="encoding-dd" class="inline-dd"></div></label>
                <label>分包超时(ms) <input id="idle-timeout" type="number" min="1" max="500" value="100" /></label>
                <label><input id="hex-display" type="checkbox" />HEX显示</label>
                <label><input id="autoscroll" type="checkbox" checked />自动滚动</label>
                <button id="clear-log">清空</button>
                <button id="toggle-multistr" title="多字符串/HEX 发送面板">☰ 多字符串</button>
                <button id="toggle-rules" title="过滤与染色规则">🎨 规则</button>
              </div>
              <div id="log-view"></div>
              <div id="send-panel">
                <div class="send-row">
                  <div id="send-mode-dd"></div>
                  <textarea id="send-input" rows="3" placeholder="输入要发送的内容…&#10;Enter 换行 / Ctrl+Enter 发送 / ↑↓ 历史"></textarea>
                </div>
                <div class="send-row send-actions">
                  <label>换行 <div id="send-newline-dd" class="inline-dd"></div></label>
                  <label class="chk"><input id="timer-send" type="checkbox" />定时</label>
                  <input id="timer-ms" type="number" min="10" value="1000" title="定时发送间隔(ms)" />
                  <span class="hint" id="send-hint"></span>
                  <span class="spacer"></span>
                  <button id="file-btn" title="分块发送文件原始字节">发文件</button>
                  <input id="file-input" type="file" class="hidden" />
                  <button id="capture-btn" title="捕获接收数据并保存为文件">● 捕获</button>
                  <button id="send-btn" class="primary">发送 Ctrl+↵</button>
                </div>
              </div>
            </div>
            <aside id="rules-panel" class="hidden">
              <div class="ms-toolbar">
                <span class="rowtag">过滤规则</span>
                <button id="flt-add">＋ 添加</button>
                <span class="spacer"></span>
                <button id="flt-clear">清空</button>
              </div>
              <div id="flt-rows"></div>
              <div class="ms-toolbar">
                <label class="chk"><input id="color-master" type="checkbox" checked />染色总开关</label>
                <label class="chk"><input id="color-yield" type="checkbox" checked />ANSI 让位</label>
              </div>
              <div class="ms-toolbar">
                <span class="rowtag">用户染色规则</span>
                <button id="color-add">＋ 添加</button>
                <span class="spacer"></span>
                <button id="color-clear">清空</button>
              </div>
              <div id="color-rows"></div>
            </aside>
            <aside id="multistr-panel" class="hidden">
              <div class="ms-toolbar">
                <button id="ms-add">＋ 添加</button>
                <label class="chk"><input id="ms-loop" type="checkbox" />循环发送</label>
                <span id="ms-status"></span>
                <span class="spacer"></span>
                <button id="ms-clear">清空</button>
              </div>
              <div id="ms-rows"></div>
            </aside>
          </div>
        </section>
        <section id="page-plot" class="page hidden">
          <div id="plot-controls">
            <label>格式 <div id="plot-fmt-dd" class="inline-dd"></div></label>
            <label>通道数 <input id="plot-channels" type="number" min="1" max="32" value="1" /></label>
            <label>类型 <div id="plot-dtype-dd" class="inline-dd"></div></label>
            <label>端序 <div id="plot-endian-dd" class="inline-dd"></div></label>
            <label>分隔符 <input id="plot-delimiter" value="," size="3" /></label>
            <label>点数上限 <input id="plot-maxpoints" type="number" min="100" max="20000" value="2000" /></label>
            <button id="plot-apply">应用</button>
            <span id="plot-info"></span>
          </div>
          <div id="plot-holder"></div>
        </section>
        <section id="page-stats" class="page hidden">
          <h3>连接统计</h3>
          <div id="stat-cards" class="cards"></div>
          <h3>通道指标（来自绘图引擎）</h3>
          <table id="ch-metrics"><thead><tr></tr></thead><tbody></tbody></table>
        </section>
      </main>
    </div>
    <footer id="statusbar">
      <span id="sb-state">未连接</span>
      <span class="spacer"></span>
      <span id="sb-rx">RX 0 B</span>
      <span id="sb-tx">TX 0 B</span>
      <span id="sb-rate">↓ 0.00 KB/s ↑ 0.00 KB/s</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
