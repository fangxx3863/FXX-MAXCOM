<!doctype html>
<html lang="zh_CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAXCOM</title>
    <!-- 关键内联样式：WebView 起动到 CSS 就绪期间保持深色，消除白屏闪烁 -->
    <style>html{background:#14161a}</style>
  </head>
  <body>
    <!-- 自绘标题栏（decorations:false）：品牌名 + 标签条 + 窗口控制；空白区可拖拽移动窗口 -->
    <header id="titlebar">
      <div id="brand" data-tauri-drag-region>MAXCOM</div>
      <div id="tabstrip"></div>
      <button id="tab-new" title="新建标签页 (Ctrl+T)">＋</button>
      <div class="tb-drag" data-tauri-drag-region></div>
      <div id="win-controls">
        <button id="win-min" title="最小化">&#x2500;</button>
        <button id="win-max" title="最大化 / 还原">&#x25a1;</button>
        <button id="win-close" title="关闭">&#x2715;</button>
      </div>
    </header>
    <!-- 启动页：纯内联样式零依赖，WebView 首帧即显示；前端初始化完成后由 main.ts 淡出移除 -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;background:#14161a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
      <div style="font:700 30px/1 'Segoe UI','Microsoft YaHei',system-ui,sans-serif;letter-spacing:3px;color:#4da3ff;">MAXCOM</div>
      <div style="width:180px;height:4px;border-radius:2px;background:#23272f;overflow:hidden;">
        <div style="width:40%;height:100%;border-radius:2px;background:#4da3ff;animation:splash-slide 1.1s ease-in-out infinite;"></div>
      </div>
      <style>@keyframes splash-slide{0%{transform:translateX(-110%)}100%{transform:translateX(460%)}}</style>
    </div>
    <div id="session-root">
    <header id="topbar">
      <div id="conn-type-dd"></div>
      <div id="serial-port-dd" class="grow"></div>
      <button id="refresh-ports" title="刷新串口列表">⟳</button>
      <div id="baud-dd"></div>
      <button id="more-serial" class="serial-only" title="数据位/停止位/校验/流控">更多串口设置 ⚙</button>
      <label class="chk serial-only"><input id="dtr-chk" type="checkbox" />DTR</label>
      <label class="chk serial-only"><input id="rts-chk" type="checkbox" />RTS</label>
      <div id="tcp-host-dd" class="hidden"></div>
      <input id="tcp-port" type="number" placeholder="端口" value="8888" class="hidden" />
      <label class="chk"><input id="auto-reconnect" type="checkbox" checked />自动重连</label>
      <button id="connect-btn" class="primary">连接</button>
      <span id="conn-state" class="dot off" title="未连接"></span>
      <span id="conn-label"></span>
      <div id="serial-setup" class="setup-pop hidden">
        <div class="setup-title">串口设置</div>
        <span class="ctl">数据位 <div id="databits-dd"></div></span>
        <span class="ctl">停止位 <div id="stopbits-dd"></div></span>
        <span class="ctl">校验 <div id="parity-dd"></div></span>
        <span class="ctl">流控 <div id="flowctl-dd"></div></span>
        <button id="setup-ok" class="primary">确定</button>
      </div>
    </header>
    <div id="layout">
      <nav id="sidebar">
        <button data-page="terminal" title="交互式终端">⌨️<span>终端</span></button>
        <button data-page="logview" class="active" title="传统收发">📄<span>收发</span></button>
        <button data-page="plot" title="数据绘图">📈<span>绘图</span></button>
        <button data-page="stats" title="统计仪表盘">📊<span>统计</span></button>
        <button data-page="settings" title="设置">⚙️<span>设置</span></button>
      </nav>
      <main id="pages">
        <section id="page-terminal" class="page hidden"></section>
        <section id="page-logview" class="page">
          <div class="logview-grid">
            <div class="logview-main">
              <div id="log-controls">
                <span class="ctl">时间戳 <div id="ts-mode-dd" class="inline-dd"></div></span>
                <span class="ctl">编码 <div id="encoding-dd" class="inline-dd"></div></span>
                <label>分包超时(ms) <input id="idle-timeout" type="number" min="1" max="500" value="10" /></label>
                <label><input id="hex-display" type="checkbox" />HEX显示</label>
                <label><input id="autoscroll" type="checkbox" checked />自动滚动</label>
                <input id="quick-filter" placeholder="过滤：仅显示匹配行" title="支持正则（非法时按子串匹配），对新旧数据即时生效" size="16" />
                <button id="clear-log">清空</button>
                <button id="toggle-multistr" title="多字符串/HEX 发送面板">☰ 多字符串</button>
                <button id="toggle-rules" title="过滤与染色规则">🎨 规则</button>
              </div>
              <div id="log-view"></div>
              <div id="send-panel">
                <div class="send-row">
                  <div id="send-mode-dd"></div>
                  <textarea id="send-input" rows="3" placeholder="输入要发送的内容…&#10;Enter 换行 / Ctrl+Enter 发送 / ↑↓ 历史"></textarea>
                </div>
                <div class="send-row send-actions">
                  <span class="ctl">换行 <div id="send-newline-dd" class="inline-dd"></div></span>
                  <label class="chk"><input id="timer-send" type="checkbox" />定时</label>
                  <input id="timer-ms" type="number" min="10" value="1000" title="定时发送间隔(ms)" />
                  <span class="hint" id="send-hint"></span>
                  <span class="spacer"></span>
                  <button id="file-btn" title="分块发送文件原始字节">发文件</button>
                  <input id="file-input" type="file" class="hidden" />
                  <button id="capture-btn" title="捕获接收数据并保存为文件">● 捕获</button>
                  <button id="send-btn" class="primary">发送 Ctrl+↵</button>
                </div>
              </div>
            </div>
            <aside id="rules-panel" class="hidden">
              <div class="ms-toolbar">
                <span class="rowtag">过滤规则</span>
                <button id="flt-add">＋ 添加</button>
                <span class="spacer"></span>
                <button id="flt-clear">清空</button>
                <button id="rules-close" class="icon-btn" title="关闭面板">✕</button>
              </div>
              <div id="flt-rows"></div>
              <div class="ms-toolbar">
                <label class="chk"><input id="color-master" type="checkbox" checked />染色总开关</label>
                <label class="chk"><input id="color-yield" type="checkbox" checked />ANSI 让位</label>
              </div>
              <div class="ms-toolbar">
                <span class="rowtag">用户染色规则</span>
                <button id="color-add">＋ 添加</button>
                <span class="spacer"></span>
                <button id="color-clear">清空</button>
              </div>
              <div id="color-rows"></div>
            </aside>
            <aside id="multistr-panel" class="hidden">
              <div class="ms-toolbar">
                <button id="ms-add">＋ 添加</button>
                <label class="chk"><input id="ms-loop" type="checkbox" />循环发送</label>
                <span id="ms-status"></span>
                <span class="spacer"></span>
                <button id="ms-clear">清空</button>
                <button id="ms-close" class="icon-btn" title="关闭面板">✕</button>
              </div>
              <div id="ms-rows"></div>
            </aside>
          </div>
        </section>
        <section id="page-plot" class="page hidden">
          <div id="plot-controls">
            <span class="ctl">格式 <div id="plot-fmt-dd" class="inline-dd"></div></span>
            <span id="plot-ch-ctl">
              <label>通道数 <input id="plot-channels" type="number" min="1" max="32" value="1" /></label>
              <span class="ctl">类型 <div id="plot-dtype-dd" class="inline-dd"></div></span>
              <span class="ctl">端序 <div id="plot-endian-dd" class="inline-dd"></div></span>
            </span>
            <label id="plot-ascii-ctl" class="hidden" title="列数由首行数据自动探测，列数变更自动跟随">分隔符 <input id="plot-delimiter" value="," size="3" /></label>
            <span class="ctl" id="plot-asplit-ctl" title="分通道：第i列→第i通道；分包：整行=单通道样本序列，新行覆盖（如 FFT 数组打印）">拆分 <div id="plot-asplit-dd" class="inline-dd"></div></span>
            <span id="plot-custom-ctl" class="hidden">
              <label title="十六进制帧头，可含空格，如 AA BB">帧头(HEX) <input id="plot-frame-header" value="AA BB" size="7" /></label>
              <span class="ctl">帧长 <div id="plot-framelen-dd" class="inline-dd"></div></span>
              <label id="plot-framelen-fixed" title="载荷总字节数（不含帧头/长度/校验字节）">定长 <input id="plot-frame-size" type="number" min="1" max="255" value="1" /></label>
              <label class="chk" title="载荷逐字节累加和（低8位），附于帧尾">校验 <input id="plot-checksum" type="checkbox" /></label>
            </span>
            <span class="ctl">显示 <div id="plot-view-dd" class="inline-dd"></div></span>
            <span class="ctl">布局 <div id="plot-layout-dd" class="inline-dd"></div></span>
            <span class="ctl">Y轴范围 <div id="plot-yrange-dd" class="inline-dd"></div></span>
            <span id="plot-ycustom-ctl" class="hidden">
              <input id="plot-ymin" type="number" value="-100" title="Y 最小值" />
              <span class="ctl">~</span>
              <input id="plot-ymax" type="number" value="100" title="Y 最大值" />
            </span>
            <label title="X 轴缓冲点数，改动即生效（会清空当前波形）">X轴点数 <input id="plot-buffer" type="number" min="100" max="1000000" step="100" value="10000" /></label>
            <button id="plot-apply">应用</button>
            <span id="plot-info"></span>
          </div>
          <div id="plot-chbar" class="hidden"></div>
          <div id="plot-bars" class="hidden"></div>
          <div id="plot-holder"></div>
        </section>
        <section id="page-stats" class="page hidden">
          <h3>连接统计</h3>
          <div id="stat-cards" class="cards"></div>
          <h3>通道指标（来自绘图引擎）</h3>
          <table id="ch-metrics"><thead><tr></tr></thead><tbody></tbody></table>
        </section>
        <section id="page-settings" class="page hidden">
          <div class="settings-body">
            <div class="settings-header">
              <h3>外观</h3>
              <button id="set-reset" class="ghost" title="恢复所有外观设置为默认值">恢复默认</button>
            </div>
            <p class="hint-p">设置即时生效并保存在浏览器本地。恢复默认可点击右上角按钮。</p>
            <div class="settings-grid">
              <div class="set-card">
                <div class="set-card-head">📄 收发区</div>
                <div class="set-field">
                  <span class="set-label">字体大小</span>
                  <input id="set-log-size" type="number" min="9" max="28" step="0.5" />
                </div>
                <div class="set-field">
                  <span class="set-label">字体</span>
                  <select id="set-log-family">
                    <option value='Consolas, "Cascadia Mono", monospace'>Consolas</option>
                    <option value='"Cascadia Mono", Consolas, monospace'>Cascadia Mono</option>
                    <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
                    <option value='"Microsoft YaHei", sans-serif'>微软雅黑（非等宽）</option>
                    <option value='system-ui, sans-serif'>系统默认（非等宽）</option>
                  </select>
                </div>
                <div class="set-note">影响日志视图与 HEX 显示的字体。</div>
              </div>
              <div class="set-card">
                <div class="set-card-head">⌨️ 终端</div>
                <div class="set-field">
                  <span class="set-label">终端字号</span>
                  <input id="set-term-size" type="number" min="8" max="32" />
                </div>
                <div class="set-note">xterm 终端模拟器的显示字号。</div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <footer id="statusbar">
      <span id="sb-state">未连接</span>
      <span class="spacer"></span>
      <span id="sb-rx">RX 0 B</span>
      <span id="sb-tx">TX 0 B</span>
      <span id="sb-rate">↓ 0.00 KB/s ↑ 0.00 KB/s</span>
    </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
