[package]
name = "maxcom"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "MAXCOM 桌面外壳：Tauri 薄胶水层"

# Tauri 移动端（Android/iOS）必须把外壳打成共享库/静态库：Android 构建需要
# lib<name>.so（cdylib）作为 native library artifact，不然 `tauri android build`
# 报 "Library artifact not found ... libmaxcom.so"。桌面端 build 仍输出 maxcom 二进制。
[lib]
name = "maxcom"
crate-type = ["staticlib", "cdylib", "rlib"]

# 独立于根 workspace（Tauri 惯例，自带 lockfile）
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
maxcom-core = { path = "../../crates/maxcom-core" }
# serial/rtt 改经外壳 feature 透传。default 保持空；桌面平台由
# tauri.<platform>.conf.json 的 build.features 显式开启 desktop，避免移动端
# 链接 probe-rs(nusb)/serialport（Android 无法编译）。
maxcom-engine = { path = "../../crates/maxcom-engine", default-features = false }

[features]
# LDK: 本地开发可关掉串口以加速编译：cargo build --no-default-features
default = []
# 桌面（Windows/Linux/macOS）：串口 + probe-rs RTT + USB 原始传输（winusb/hid）
desktop = ["maxcom-engine/serial", "maxcom-engine/rtt", "maxcom-engine/usb"]
# 移动端（Android/iOS）：串口枚举/RTT 不可用，仅网络传输
mobile = []
custom-protocol = ["tauri/custom-protocol"]
