[package]
name = "maxcom"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "MAXCOM 桌面外壳：Tauri 薄胶水层"

# 独立于根 workspace（Tauri 惯例，自带 lockfile）
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
maxcom-core = { path = "../../crates/maxcom-core" }
maxcom-engine = { path = "../../crates/maxcom-engine" }

[features]
# LDK: 本地开发可关掉串口以加速编译：cargo build --no-default-features
default = []
custom-protocol = ["tauri/custom-protocol"]
